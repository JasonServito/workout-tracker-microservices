# Local development stack. The database credentials here are for local use only.

x-db-env: &db-env
  MYSQL_USER: app
  MYSQL_PASSWORD: app
  MYSQL_RANDOM_ROOT_PASSWORD: "yes"

x-db-healthcheck: &db-healthcheck
  test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
  interval: 5s
  timeout: 5s
  retries: 30

services:
  kubemq:
    image: kubemq/kubemq-community:v2.4.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  workout-db:
    build: ./AddWorkout/db
    image: workout-tracker/workout-db:latest
    environment:
      <<: *db-env
      MYSQL_DATABASE: workoutdb
    healthcheck: *db-healthcheck

  search-db:
    build: ./SearchWorkouts/db
    image: workout-tracker/search-db:latest
    environment:
      <<: *db-env
      MYSQL_DATABASE: searchdb
    healthcheck: *db-healthcheck

  user-db:
    build: ./Frontend/db
    image: workout-tracker/user-db:latest
    environment:
      <<: *db-env
      MYSQL_DATABASE: userdb
    healthcheck: *db-healthcheck

  add-workout:
    build: ./AddWorkout
    image: workout-tracker/add-workout:latest
    environment:
      DB_URL: jdbc:mysql://workout-db:3306/workoutdb?serverTimezone=UTC
      DB_USER: app
      DB_PASSWORD: app
      CATALINA_OPTS: -DkubeMQAddress=kubemq:50000
    ports:
      - "8081:8080"
    depends_on:
      workout-db:
        condition: service_healthy
      kubemq:
        condition: service_healthy

  search-workouts:
    build: ./SearchWorkouts
    image: workout-tracker/search-workouts:latest
    environment:
      DB_URL: jdbc:mysql://search-db:3306/searchdb?serverTimezone=UTC
      DB_USER: app
      DB_PASSWORD: app
      kubeMQAddress: kubemq:50000
    ports:
      - "8082:8080"
    depends_on:
      search-db:
        condition: service_healthy
      kubemq:
        condition: service_healthy

  frontend:
    build: ./Frontend
    image: workout-tracker/frontend:latest
    environment:
      DB_URL: jdbc:mysql://user-db:3306/userdb?serverTimezone=UTC
      DB_USER: app
      DB_PASSWORD: app
    ports:
      - "8080:8080"
    depends_on:
      user-db:
        condition: service_healthy
